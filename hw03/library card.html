<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Card Form - Vallejo Public Library</title>
    <style>
        #confirmationMessage {
            color: blue;
        }
    </style>
</head>

<body>

    <header>
        <h1>Vallejo Public Library</h1>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="library card.html">Library Card Form</a></li>
                <li><a href="inquiries.html">Inquiries</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Library Card Application Form</h2>
        <div id="confirmationMessage" aria-live="polite"></div>

        <form id="libraryCardForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required>

            <label for="photo">Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>

            <input type="submit" value="Submit Application">
        </form>

        <script>
            function initializeLibraryCardForm() {
                const form = document.getElementById("libraryCardForm");
                const confirmationMessage = document.getElementById("confirmationMessage");
                form.addEventListener("submit", function (event) {
                    event.preventDefault();
                    if (!form.reportValidity()) return;
                    confirmationMessage.textContent = "The form is complete. This classroom demo does not send applications.";
                });
            }
            initializeLibraryCardForm();
        </script>
    </main>

    <footer>
        <p>&copy; 2024 Vallejo Public Library. All rights reserved.</p>
    </footer>

</body>

</html>
